name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test-only, POSTGRES_DB: settlebook_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d settlebook_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/settlebook_test
      SECRET_KEY: ci-only-key-at-least-32-characters
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: pytest -v -ra --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pytest-results, path: results.xml}
