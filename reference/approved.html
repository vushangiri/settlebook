<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Settlebook — Approved Interactive UI Reference</title><meta name="theme-color" content="#f6f7fb"><style>
*{box-sizing:border-box}body{margin:0;font:14px Inter,ui-sans-serif,system-ui,sans-serif;background:#e9eaf2;display:flex;justify-content:center;align-items:center;min-height:100vh}.device{--bg:#f6f7fb;--surface:#fff;--ink:#19213a;--secondary:#46516b;--muted:#69758c;--line:#e1e5ef;--soft:#eeecff;--purple:#6255dc;--positive:#087d5b;--negative:#c44251;--shadow:#141c3410;background:var(--bg);color:var(--ink);width:100%;max-width:410px;height:min(850px,100dvh);border:1px solid var(--line);border-radius:30px;overflow:hidden;position:relative;box-shadow:0 14px 40px #00000015;transition:background .3s,color .3s}.device.dark{--bg:#10121c;--surface:#1c2030;--ink:#f4f5ff;--secondary:#d2d6e7;--muted:#aab3ca;--line:#34394c;--soft:#353057;--purple:#a79aff;--positive:#66dfb1;--negative:#ff969c;--shadow:#00000030}.top{height:70px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}.logo{font-size:23px;font-weight:850;letter-spacing:-1.1px;color:var(--ink)}.logo span{color:var(--purple)}.round{width:39px;height:39px;border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--purple);font-size:18px;display:grid;place-items:center;cursor:pointer}.screen{height:calc(100% - 140px);overflow:auto;padding:20px 19px 26px;scrollbar-width:none;animation:show .22s ease}.screen::-webkit-scrollbar{display:none}@keyframes show{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}h2{font-size:25px;letter-spacing:-.7px;font-weight:850;margin:0 0 5px;color:var(--ink)}h3{font-size:16px;font-weight:800;color:var(--ink);margin:0}.sub{font-size:12px;color:var(--muted);line-height:1.6}.section{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.link{border:0;background:none;color:var(--purple);font-size:12px;font-weight:750;cursor:pointer}.hero{border-radius:22px;padding:23px;background:linear-gradient(125deg,#2d275e,#5648b8 75%,#7668ed);color:white;box-shadow:0 9px 22px #443ba132;margin-top:17px}.hero small{color:#e2dfff;font-size:12px}.hero .total{font-size:37px;font-weight:850;letter-spacing:-1.3px;margin:8px 0 19px}.stats{display:flex;gap:10px}.stat{flex:1;background:#ffffff1b;padding:12px;border-radius:12px}.stat strong{display:block;font-size:17px;color:white;margin-top:6px}.stat small{font-size:11px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:19px}.quick button{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:13px 3px;border-radius:15px;font-size:12px;font-weight:750;cursor:pointer}.qico{display:grid;place-items:center;margin:0 auto 9px;width:39px;height:39px;border-radius:13px;background:var(--soft);color:var(--purple);font-size:22px}.entry{width:100%;display:flex;align-items:center;text-align:left;gap:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:13px;margin:8px 0;color:var(--ink);cursor:pointer}.initial{width:42px;height:42px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--purple);font-size:13px;font-weight:850}.entry .middle{flex:1;min-width:0}.entry strong{font-size:13px;color:var(--ink);display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.entry .value{font-size:13px;font-weight:850;white-space:nowrap}.positive{color:var(--positive)!important}.negative{color:var(--negative)!important}.bottom{position:absolute;bottom:0;left:0;right:0;height:70px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px 10px}.bottom button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}.bottom button.active{color:var(--purple)}.bottom .symbol{font-size:22px;line-height:26px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px;margin:13px 0}.field{margin:16px 0}label{display:block;font-size:12px;font-weight:750;color:var(--secondary);margin-bottom:8px}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:13px;font:inherit;outline:none;color-scheme:light}.dark input,.dark select,.dark textarea{color-scheme:dark}input:focus,select:focus{border-color:var(--purple)}input::placeholder{color:var(--muted)}.primary{width:100%;border:0;border-radius:12px;background:#6657df;color:white;font-weight:800;padding:14px;cursor:pointer}.secondary{border:1px solid var(--line);background:var(--surface);color:var(--purple);border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.back{background:none;border:0;color:var(--purple);font-weight:750;padding:0 0 17px;cursor:pointer}.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;background:none;border:0;color:var(--secondary);font-size:12px;font-weight:750;border-radius:9px;padding:10px 4px;cursor:pointer}.seg button.sel{background:var(--surface);color:var(--purple);box-shadow:0 2px 7px var(--shadow)}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink)}.line:last-child{border:0}.chip{border:1px solid var(--line);background:var(--surface);color:var(--secondary);padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}.chip.selected{background:var(--soft);color:var(--purple);border-color:var(--purple)}.hint{background:var(--soft);border-radius:13px;color:var(--secondary);padding:13px;font-size:12px;line-height:1.6;margin:14px 0}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--purple);font-size:10px;font-weight:800}.toast{position:absolute;bottom:82px;left:18px;right:18px;background:#393352;color:white;text-align:center;padding:13px;border-radius:13px;z-index:10;font-size:12px}button{transition:transform .15s,background .25s,color .25s}button:active{transform:scale(.97)}@media(max-width:430px){body{background:var(--bg);align-items:stretch}.device{max-width:none;height:100dvh;border:0;border-radius:0;box-shadow:none}.top{padding-top:env(safe-area-inset-top);height:calc(70px + env(safe-area-inset-top))}.bottom{height:calc(70px + env(safe-area-inset-bottom));padding-bottom:calc(10px + env(safe-area-inset-bottom))}.screen{height:calc(100% - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="device" id="device"><header class="top"><div class="logo">settle<span>book.</span></div><div style="display:flex;gap:9px"><button class="round" id="theme" aria-label="Toggle dark mode">☾</button><button class="round" data-go="profile" aria-label="Profile" style="font-size:12px;font-weight:850">BG</button></div></header><section class="screen" id="screen"></section><nav class="bottom" id="nav"></nav><div id="message" aria-live="polite"></div></main><script>
/* Approved Settlebook interactive visual reference. Frontend-only demo; no persistence, authentication, or network sync. */
(()=>{const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let dark=false,page='home',history=[],selectedPerson=1,selectedGroup=1,kind='given',mode='equal',chosen=[1,2];let people=[{id:1,name:'Sahil Sharma',phone:'0400111222',email:'sahil@example.com',linked:true},{id:2,name:'Priya Patel',phone:'0400222333',email:'priya@example.com',linked:true},{id:3,name:'Alex Morgan',phone:'',email:'',linked:false}];let transactions=[{id:1,pid:1,amount:85,kind:'given',note:'Dinner last Friday',date:'28 Oct',source:'personal'},{id:2,pid:2,amount:42,kind:'taken',note:'Coffee and snacks',date:'27 Oct',source:'personal'},{id:3,pid:3,amount:120,kind:'given',note:'Tickets',date:'25 Oct',source:'personal'}];let groups=[{id:1,name:'Weekend Getaway',members:[1,2,3],expenses:[{id:1,payer:1,amount:180,note:'Accommodation',shares:{0:45,1:45,2:45,3:45}},{id:2,payer:0,amount:96,note:'Groceries',shares:{0:24,1:24,2:24,3:24}}],final:false}];const money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),person=id=>Number(id)===0?{name:'You'}:people.find(p=>p.id===Number(id))||{name:'Unknown'},initials=s=>s.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(),balance=id=>transactions.filter(t=>t.pid===id).reduce((n,t)=>n+(t.kind==='given'?t.amount:-t.amount),0),group=()=>groups.find(g=>g.id===selectedGroup);const button=(s,a,c='secondary')=>'<button class="'+c+'" data-go="'+a+'">'+s+'</button>',field=(label,id,placeholder,type='text')=>'<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" placeholder="'+placeholder+'"></div>';function row(title,sub,value,action,icon){return '<button class="entry" data-go="'+action+'"><span class="initial">'+esc(icon||initials(title))+'</span><span class="middle"><strong>'+esc(title)+'</strong><small>'+esc(sub)+'</small></span><span class="value">'+value+'</span></button>'}function txrow(t){return row(person(t.pid).name,t.note||'Transaction','<span class="'+(t.kind==='given'?'positive':'negative')+'">'+(t.kind==='given'?'+':'−')+money(t.amount)+'</span>','person:'+t.pid)}function head(title,sub){return '<h2>'+title+'</h2><div class="sub">'+sub+'</div>'}function back(){return '<button class="back" data-go="back">← Back</button>'}function home(){let pos=people.reduce((s,p)=>s+Math.max(0,balance(p.id)),0),neg=people.reduce((s,p)=>s+Math.max(0,-balance(p.id)),0);return head('Your money, clear.','Your personal finance overview')+'<div class="hero"><small>Your net balance</small><div class="total">'+money(pos-neg)+'</div><div class="stats"><div class="stat"><small>↙ You are owed</small><strong>'+money(pos)+'</strong></div><div class="stat"><small>↗ You owe</small><strong>'+money(neg)+'</strong></div></div></div><div class="quick"><button data-go="newtx"><span class="qico">＋</span>New entry</button><button data-go="split"><span class="qico">◫</span>Split bill</button><button data-go="newgroup"><span class="qico">♧</span>New group</button></div><div class="section"><h3>People</h3>'+button('See all','people','link')+'</div>'+people.slice(0,3).map(p=>row(p.name,p.linked?'● Connected':'○ Local contact','<span class="'+(balance(p.id)>=0?'positive':'negative')+'">'+money(Math.abs(balance(p.id)))+'</span>','person:'+p.id)).join('')+'<div class="section"><h3>Recent activity</h3>'+button('See all','activity','link')+'</div>'+transactions.slice().reverse().slice(0,3).map(txrow).join('')}function peoplePage(){return head('People','All your personal ledgers in one place')+field('Search','search','Search people')+'<div class="section"><h3>'+people.length+' contacts</h3>'+button('+ Add person','addperson')+'</div><div id="list">'+people.map(p=>row(p.name,p.linked?'Connected account':'Local contact','<span class="'+(balance(p.id)>=0?'positive':'negative')+'">'+money(Math.abs(balance(p.id)))+'</span>','person:'+p.id)).join('')+'</div>'}function personPage(){let p=person(selectedPerson),b=balance(selectedPerson);return back()+'<div style="text-align:center"><div class="initial" style="width:68px;height:68px;margin:0 auto 13px;font-size:21px;border-radius:22px">'+initials(p.name)+'</div>'+head(esc(p.name),esc(p.phone||'No phone')+' · '+(p.linked?'Connected':'Local contact'))+'</div><div class="panel" style="text-align:center;margin-top:23px"><div class="sub">'+(b>=0?'Owes you':'You owe')+'</div><div class="'+(b>=0?'positive':'negative')+'" style="font-size:32px;font-weight:850;margin:9px 0 20px">'+money(Math.abs(b))+'</div><div style="display:flex;gap:8px">'+button('＋ New entry','newtx','primary')+button('Repayment','repay')+'</div></div><div class="section"><h3>Ledger history</h3><span class="sub">'+transactions.filter(t=>t.pid===p.id).length+' entries</span></div>'+transactions.filter(t=>t.pid===p.id).slice().reverse().map(t=>'<div class="panel"><div class="line" style="padding:0 0 10px"><strong>'+esc(t.note)+'</strong><strong class="'+(t.kind==='given'?'positive':'negative')+'">'+(t.kind==='given'?'+':'−')+money(t.amount)+'</strong></div><div class="sub" style="margin-top:9px">'+t.date+' · '+(t.source==='group'?'Group settlement':t.kind==='given'?'Money given':'Money taken')+'</div></div>').join('')}function txForm(){return back()+head(page==='repay'?'Record repayment':'New transaction','Add an entry to an individual ledger')+'<div class="field"><label>Person</label><select id="txperson">'+people.map(p=>'<option value="'+p.id+'" '+(p.id===selectedPerson?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Transaction type</label><div class="seg"><button data-go="kind:given" class="'+(kind==='given'?'sel':'')+'">↗ Money given</button><button data-go="kind:taken" class="'+(kind==='taken'?'sel':'')+'">↙ Money taken</button></div></div>'+field('Amount (AUD)','txamount','0.00','number')+field('Description','txnote','What was this for?')+'<div class="field"><label>Attachment (optional)</label><input id="txfile" type="file" accept="image/*,.pdf"></div><div class="hint">Money given increases what the other person owes you. Money taken increases what you owe them.</div>'+button('Save transaction','savetx','primary')}function addPerson(){return back()+head('Add a person','You can add contacts who are not registered.')+field('Full name','pname','e.g. Sam Taylor')+field('Phone number','pphone','+61 400 000 000','tel')+field('Email (optional)','pemail','name@example.com','email')+'<div class="hint">Existing verified accounts will be linked by the backend. New contacts remain local in this demo.</div>'+button('Save person','saveperson','primary')}function split(){return back()+head('Split a bill','Divide an expense among participants')+field('Description','splitnote','e.g. Restaurant dinner')+field('Total (AUD)','splitamount','0.00','number')+'<div class="field"><label>Paid by</label><select id="splitpayer"><option value="0">You</option>'+people.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Split method</label><div class="seg"><button class="'+(mode==='equal'?'sel':'')+'" data-go="mode:equal">Equal</button><button class="'+(mode==='custom'?'sel':'')+'" data-go="mode:custom">Custom</button></div></div><div class="section"><h3>Participants</h3><span class="sub">You included</span></div><div class="panel"><div class="line"><strong>You</strong><span class="sub">✓ Included</span></div>'+people.map(p=>'<div class="line"><strong>'+esc(p.name)+'</strong><button class="chip '+(chosen.includes(p.id)?'selected':'')+'" data-go="toggle:'+p.id+'">'+(chosen.includes(p.id)?'✓ Included':'+ Add')+'</button></div>').join('')+'</div>'+(mode==='custom'?'<div class="panel"><h3>Custom shares</h3>'+[0,...chosen].map(id=>field(person(id).name,'share'+id,'0.00','number')).join('')+'</div>':'<div class="hint">The amount will be split equally, including you.</div>')+button('Post split','savesplit','primary')}function groupsPage(){return head('Groups','Separate temporary ledgers for shared expenses')+'<div style="margin:20px 0">'+button('＋ Create group','newgroup','primary')+'</div>'+groups.map(g=>row(g.name,(g.members.length+1)+' members · '+g.expenses.length+' expenses',g.final?'<span class="positive">Finalized</span>':'<span class="pill">Open</span>','group:'+g.id,'♧')).join('')}function groupNet(g){let n={};[0,...g.members].forEach(id=>n[id]=0);g.expenses.forEach(e=>{n[e.payer]+=e.amount;Object.entries(e.shares).forEach(([id,v])=>n[id]-=v)});return n}function settle(net){let d=Object.entries(net).filter(([k,v])=>v<-.005).map(([id,v])=>({id:+id,n:-v})),c=Object.entries(net).filter(([k,v])=>v>.005).map(([id,v])=>({id:+id,n:v})),out=[],i=0,j=0;while(i<d.length&&j<c.length){let a=Math.min(d[i].n,c[j].n);if(a>.005)out.push({from:d[i].id,to:c[j].id,amount:Math.round(a*100)/100});d[i].n-=a;c[j].n-=a;if(d[i].n<.005)i++;if(c[j].n<.005)j++}return out}function groupPage(){let g=group(),transfers=settle(groupNet(g));return back()+head(esc(g.name),'Shared expenses and group settlement')+'<span class="pill">'+(g.final?'Finalized':'Temporary ledger')+'</span><div class="hero"><small>Total group spending</small><div class="total">'+money(g.expenses.reduce((s,e)=>s+e.amount,0))+'</div><small>'+g.expenses.length+' expenses · '+(g.members.length+1)+' members</small></div><div class="section"><h3>Members</h3>'+(!g.final?button('+ Add','groupmember'):'')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+[0,...g.members].map(id=>'<span class="chip">'+esc(person(id).name)+'</span>').join('')+'</div><div class="section"><h3>Expenses</h3>'+(!g.final?button('+ Expense','groupexpense'):'')+'</div>'+g.expenses.map(e=>row(e.note,'Paid by '+person(e.payer).name,money(e.amount),'noop','◈')).join('')+'<div class="section"><h3>Settlement preview</h3></div><div class="panel">'+(transfers.length?transfers.map(t=>'<div class="line"><span><strong>'+esc(person(t.from).name)+'</strong><div class="sub">Pays '+esc(person(t.to).name)+'</div></span><strong>'+money(t.amount)+'</strong></div>').join(''):'<div class="sub">Everyone is balanced.</div>')+'</div><div class="hint">'+(g.final?'Finalized. Obligations involving you have been posted to individual ledgers.':'Balances remain isolated until finalization. Finalizing posts obligations involving you to your personal ledger.')+'</div>'+(!g.final?button('Finalize group','finalize','primary'):'')}function newGroup(){return back()+head('Create group','A separate ledger for shared spending')+field('Group name','gname','e.g. Weekend trip')+'<div class="section"><h3>Members</h3></div><div class="panel">'+people.map(p=>'<label class="line" style="margin:0"><span>'+esc(p.name)+'</span><input type="checkbox" class="gm" value="'+p.id+'" style="width:19px;height:19px"></label>').join('')+'</div>'+button('Create group','savegroup','primary')}function groupExpense(){let g=group();return back()+head('Add group expense','This will not affect individual ledgers')+field('Description','genote','e.g. Accommodation')+field('Amount (AUD)','geamount','0.00','number')+'<div class="field"><label>Paid by</label><select id="gepayer">'+[0,...g.members].map(id=>'<option value="'+id+'">'+esc(person(id).name)+'</option>').join('')+'</select></div><div class="section"><h3>Split between</h3></div><div class="panel">'+[0,...g.members].map(id=>'<label class="line" style="margin:0"><span>'+esc(person(id).name)+'</span><input type="checkbox" class="gepart" value="'+id+'" checked style="width:19px;height:19px"></label>').join('')+'</div>'+button('Add expense','savege','primary')}function groupMember(){let g=group();return back()+head('Add members','Select a contact to join this group')+people.filter(p=>!g.members.includes(p.id)).map(p=>row(p.name,'Contact','＋','member:'+p.id)).join('')}function activity(){return head('Activity','Your personal ledger history')+transactions.slice().reverse().map(txrow).join('')}function profile(){return head('Your profile','Account and preferences')+'<div class="panel"><div class="initial" style="margin-bottom:13px">BG</div>'+field('Name','myname','Your name')+field('Phone','myphone','Phone number','tel')+field('Email','myemail','Email address','email')+'<div class="field"><label>Profile picture</label><input type="file" accept="image/*"></div>'+button('Save demo profile','demoprofile','primary')+'</div><div class="panel"><h3>Appearance</h3><div class="line"><span>Dark mode</span><button class="chip selected" data-go="theme">'+(dark?'☀ Switch to light':'☾ Switch to dark')+'</button></div></div><div class="panel"><h3>Account</h3><p class="sub">Preview registration and account creation screens.</p>'+button('Create account','register')+'</div>'}function register(){return back()+head('Create account','Join Settlebook')+field('Full name','regname','Full name')+field('Phone number','regphone','+61 400 000 000','tel')+field('Email','regemail','Email address','email')+field('Password','regpass','Minimum 8 characters','password')+'<div class="field"><label>Profile picture (optional)</label><input type="file" accept="image/*"></div>'+button('Create demo account','demoprofile','primary')}function notify(msg){q('#message').innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>q('#message').innerHTML='',2700)}function render(){q('#device').classList.toggle('dark',dark);q('#theme').textContent=dark?'☀':'☾';q('meta[name="theme-color"]').content=dark?'#10121c':'#f6f7fb';const views={home,people:peoplePage,person:personPage,newtx:txForm,repay:txForm,addperson:addPerson,split,groups:groupsPage,group:groupPage,newgroup:newGroup,groupexpense:groupExpense,groupmember:groupMember,activity,profile,register};q('#screen').innerHTML=(views[page]||home)();q('#screen').scrollTop=0;q('#nav').innerHTML=[['home','⌂','Home'],['people','♙','People'],['newtx','⊕','Add'],['groups','♧','Groups'],['activity','▤','Activity']].map(([p,ico,title])=>'<button data-go="'+p+'" class="'+(page===p?'active':'')+'"><span class="symbol">'+ico+'</span>'+title+'</button>').join('');if(q('#search'))q('#search').addEventListener('input',e=>qa('#list .entry').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'flex':'none'))}function go(p){history.push(page);page=p;render()}function goback(){page=history.pop()||'home';render()}function number(id){return Number(q('#'+id)?.value||0)}function addtx(pid,amount,k,note,source='personal'){transactions.push({id:Date.now()+Math.random(),pid,amount,kind:k,note,date:'Today',source})}function saveTx(){let a=number('txamount');if(!Number.isFinite(a)||a<=0)return notify('Enter a valid amount');selectedPerson=Number(q('#txperson').value);addtx(selectedPerson,Math.round(a*100)/100,kind,q('#txnote').value||'Transaction');go('person');notify('Transaction saved')}function saveSplit(){let a=number('splitamount'),payer=Number(q('#splitpayer').value),members=[0,...chosen],shares={},cents=Math.round(a*100);if(!Number.isFinite(a)||a<=0)return notify('Enter a valid total');if(!members.includes(payer))return notify('Include the payer as a participant');if(mode==='equal'){let each=Math.floor(cents/members.length),rem=cents%members.length;members.forEach((id,i)=>shares[id]=(each+(i<rem?1:0))/100)}else{let sum=0;members.forEach(id=>{let v=number('share'+id);shares[id]=Math.round(v*100)/100;sum+=Math.round(v*100)});if(Object.values(shares).some(v=>v<0)||sum!==cents)return notify('Custom shares must equal the total')}let note=q('#splitnote').value||'Split bill';members.forEach(id=>{if(id===payer||!shares[id])return;if(payer===0)addtx(id,shares[id],'given',note);else if(id===0)addtx(payer,shares[id],'taken',note)});go('home');notify(payer!==0&&members.some(id=>id!==0&&id!==payer)?'Your shares saved; third-party debts need shared ledger support':'Split posted')}function saveGroup(){let name=q('#gname').value.trim();if(!name)return notify('Enter a group name');let members=qa('.gm:checked').map(el=>Number(el.value)),g={id:Date.now(),name,members,expenses:[],final:false};groups.push(g);selectedGroup=g.id;go('group');notify('Group created')}function saveGE(){let g=group(),a=number('geamount'),ids=qa('.gepart:checked').map(el=>Number(el.value));if(!Number.isFinite(a)||a<=0||!ids.length)return notify('Enter an amount and participants');let cents=Math.round(a*100),each=Math.floor(cents/ids.length),rem=cents%ids.length,shares={};ids.forEach((id,i)=>shares[id]=(each+(i<rem?1:0))/100);g.expenses.push({id:Date.now(),payer:Number(q('#gepayer').value),amount:cents/100,note:q('#genote').value||'Expense',shares});go('group');notify('Expense saved to group')}function finalize(){let g=group();if(g.final)return;settle(groupNet(g)).forEach(t=>{if(t.to===0)addtx(t.from,t.amount,'given','Group: '+g.name,'group');else if(t.from===0)addtx(t.to,t.amount,'taken','Group: '+g.name,'group')});g.final=true;render();notify('Group finalized')}function action(a){if(a==='theme'){dark=!dark;render();return}if(a==='back')return goback();if(a.startsWith('person:')){selectedPerson=+a.split(':')[1];return go('person')}if(a.startsWith('group:')){selectedGroup=+a.split(':')[1];return go('group')}if(a.startsWith('kind:')){kind=a.split(':')[1];return render()}if(a.startsWith('mode:')){mode=a.split(':')[1];return render()}if(a.startsWith('toggle:')){let id=+a.split(':')[1];chosen=chosen.includes(id)?chosen.filter(x=>x!==id):[...chosen,id];return render()}if(a.startsWith('member:')){group().members.push(+a.split(':')[1]);return go('group')}if(a==='savetx')return saveTx();if(a==='savesplit')return saveSplit();if(a==='savegroup')return saveGroup();if(a==='savege')return saveGE();if(a==='finalize')return finalize();if(a==='saveperson'){let name=q('#pname').value.trim();if(!name)return notify('Enter a name');people.push({id:Date.now(),name,phone:q('#pphone').value,email:q('#pemail').value,linked:false});go('people');return notify('Contact saved')}if(a==='repay'){kind=balance(selectedPerson)>=0?'taken':'given';return go('repay')}if(a==='newtx'){kind='given';return go(a)}if(a==='split'){mode='equal';chosen=people.slice(0,2).map(p=>p.id);return go(a)}if(a==='demoprofile')return notify('Preview only — backend not connected');if(a==='noop')return;if(['home','people','groups','activity','profile','register','addperson','newgroup','groupexpense','groupmember'].includes(a))return go(a)}document.addEventListener('click',e=>{let el=e.target.closest('[data-go]');if(el)action(el.dataset.go)});q('#theme').addEventListener('click',()=>action('theme'));render()})();
</script></body></html>
