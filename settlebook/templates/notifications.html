{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}{% block content %}<h2>Notifications</h2>{% for n in notifications %}<div class="panel"><a href="{{n.path}}"><strong>{{n.message}}</strong></a><p class="sub">{{n.created_at}} · {{'Read' if n.read else 'Unread'}}</p><form method="post">{{csrf()}}<input type="hidden" name="id" value="{{n.id}}"><input type="hidden" name="read" value="{{'no' if n.read else 'yes'}}"><button class="secondary">Mark {{'unread' if n.read else 'read'}}</button></form></div>{% else %}<p class="sub">No notifications yet.</p>{% endfor %}{% endblock %}
